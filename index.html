<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tippecanoe County — Upzoning Opportunity</title>
  <script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; }
    #map { width: 100vw; height: 100vh; }

    #legend {
      position: absolute;
      bottom: 32px;
      left: 12px;
      background: rgba(255,255,255,0.92);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 12px;
      line-height: 1.6;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    #legend h4 { font-size: 13px; margin-bottom: 8px; }
    #legend .gradient-bar {
      width: 220px; height: 12px; border-radius: 2px;
      background: linear-gradient(to right,
        #addd8e 0%, #d9f0a3 12%, #ffffb2 25%, #fed976 38%,
        #feb24c 50%, #fd8d3c 62%, #fc4e2a 75%, #e31a1c 85%,
        #bd0026 95%, #800026 100%);
    }
    #legend .gradient-labels {
      display: flex; justify-content: space-between;
      width: 220px; font-size: 11px; color: #444;
      margin-top: 3px; font-variant-numeric: tabular-nums;
    }
    #legend .desc { margin-top: 6px; font-size: 11px; color: #666; max-width: 220px; line-height: 1.4; }


    #popup-content { font-size: 13px; line-height: 1.7; }
    #popup-content strong { display: block; margin-bottom: 4px; font-size: 14px; }
    #popup-content table { border-collapse: collapse; width: 100%; }
    #popup-content td { padding: 1px 6px 1px 0; }
    #popup-content td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
<div id="map"></div>


<div id="legend">
  <h4>Land assessed value / lot area</h4>
  <div class="gradient-bar"></div>
  <div class="gradient-labels">
    <span>$0</span><span>$4</span><span>$10</span><span>$20+</span>
  </div>
  <div class="desc" style="margin-top:8px">
    <span style="display:inline-block;width:28px;height:3px;background:#1a006e;vertical-align:middle;margin-right:5px;border-radius:1px"></span>
    Dark border = underbuilt (ILR &lt; 3)
  </div>
  <div class="desc" style="margin-top:4px;color:#666">ILR = improvement AV / land AV</div>
</div>

<script>
  const protocol = new pmtiles.Protocol();
  maplibregl.addProtocol("pmtiles", protocol.tile.bind(protocol));

  const map = new maplibregl.Map({
    container: "map",
    style: {
      version: 8,
      sources: {
        "carto-light": {
          type: "raster",
          tiles: ["https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}@2x.png"],
          tileSize: 256,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
        }
      },
      layers: [{ id: "background", type: "raster", source: "carto-light" }]
    },
    center: [-86.878, 40.431],
    zoom: 11
  });

  // Score = land_value_per_sqft directly (pure demand signal)
  // Breakpoints tuned to county distribution: p50=$2.82, p75=$4.33, p90=$6.23, p99=$17
  const scoreColor = [
    "interpolate", ["linear"], ["get", "land_value_per_sqft"],
    0,    "#addd8e",
    2,    "#ffffb2",
    4,    "#fed976",
    6,    "#fd8d3c",
    10,   "#e31a1c",
    20,   "#800026"
  ];

  const fillPaint = {
    "fill-color": scoreColor,
    "fill-opacity": ["interpolate", ["linear"], ["zoom"], 10, 0.85, 15, 0.6]
  };
  const linePaint = {
    "line-color": "#555",
    "line-width": ["interpolate", ["linear"], ["zoom"], 12, 0.2, 16, 0.8],
    "line-opacity": 0.4
  };

  const sitesUrl = new URL("upzoning_sites.pmtiles", window.location.href).href;

  map.on("load", () => {
    map.addSource("upzoning-sites", { type: "vector", url: `pmtiles://${sitesUrl}` });
    map.addLayer({ id: "sites-fill",    type: "fill", source: "upzoning-sites", "source-layer": "sites", paint: fillPaint });
    map.addLayer({ id: "sites-outline", type: "line", source: "upzoning-sites", "source-layer": "sites", paint: linePaint });

    // Thick outline for sites flagged as underbuilt (ILR < 3.0)
    map.addLayer({
      id: "sites-underbuilt",
      type: "line",
      source: "upzoning-sites",
      "source-layer": "sites",
      filter: ["==", ["get", "underbuilt"], 1],
      paint: {
        "line-color": "#1a006e",
        "line-width": ["interpolate", ["linear"], ["zoom"], 12, 1.5, 16, 3],
        "line-opacity": 0.85
      }
    });
  });

  // Popup
  const popup = new maplibregl.Popup({ closeButton: true, maxWidth: "280px" });

  map.on("click", "sites-fill", (e) => {
    const p = e.features[0].properties;
    const fmt  = n => n != null ? Number(n).toLocaleString(undefined, { maximumFractionDigits: 2 }) : "—";
    const fmtD = n => n != null ? "$" + Number(n).toLocaleString() : "—";
    const underbuiltLabel = p.underbuilt == 1
      ? "<span style='color:#1a006e;font-weight:600'>Yes (ILR &lt; 3)</span>"
      : "No";

    popup.setLngLat(e.lngLat).setHTML(`
      <div id="popup-content">
        <strong>${p.addresses || "(no address)"}</strong>
        <table>
          <tr><td>Owner</td><td>${p.owner || "—"}</td></tr>
          <tr><td>Parcels</td><td>${p.n_parcels ?? "—"}</td></tr>
          <tr><td>Class</td><td>${p.ClassCode || "—"}</td></tr>
          <tr><td>Land $/sqft</td><td>$${fmt(p.land_value_per_sqft)}</td></tr>
          <tr><td>ILR</td><td>${fmt(p.ILR)}</td></tr>
          <tr><td>Underbuilt</td><td>${underbuiltLabel}</td></tr>
          <tr><td>Land AV</td><td>${fmtD(p.land_av)}</td></tr>
          <tr><td>Imp AV</td><td>${fmtD(p.imp_av)}</td></tr>
        </table>
      </div>`).addTo(map);
  });

  map.on("mouseenter", "sites-fill", () => { map.getCanvas().style.cursor = "pointer"; });
  map.on("mouseleave", "sites-fill", () => { map.getCanvas().style.cursor = ""; });

  map.addControl(new maplibregl.NavigationControl(), "top-right");
</script>
</body>
</html>
